[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse-rl"
version = "0.1.0"
description = "Undergraduate project comparing warehouse job-dispatch policies"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium",
    "matplotlib",
    "networkx",
    "numpy",
    "pandas",
    "stable-baselines3",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

